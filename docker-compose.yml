version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=mysql://nomad:canarias2026@mariadb:3306/nomadcanarias
      - NODE_ENV=production
    depends_on:
      - mariadb

  mariadb:
    image: mariadb:11
    container_name: vaneando_mariadb
    restart: always
    environment:
      MARIADB_USER: nomad
      MARIADB_PASSWORD: canarias2026
      MARIADB_DATABASE: nomadcanarias
      MARIADB_ROOT_PASSWORD: cambia-esta-clave
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data:
