version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://nomad:canarias2026@postgres:5432/nomadcanarias?schema=public
      - NODE_ENV=production
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    container_name: nomad_postgres
    restart: always
    environment:
      POSTGRES_USER: nomad
      POSTGRES_PASSWORD: canarias2026
      POSTGRES_DB: nomadcanarias
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
